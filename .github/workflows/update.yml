name: Update Livestock and Grain Feeds

on:
  schedule:
    - cron: "0 * * * *"
    - cron: "30 * * * *"
  workflow_dispatch:

concurrency:
  group: update-livestock-and-grain-feeds
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 playwright
        python -m playwright install --with-deps chromium

    - name: Update Griffith Sheep Report
      id: griffith
      continue-on-error: true
      run: python update_griffith.py

    - name: Update Hillston APW1 (CropConnect)
      run: python hillston_apw1.py

    - name: Update Hillston BAR1 (CropConnect)
      run: python hillston_bar1.py

    - name: Update Condobolin APW1 (CropConnect)
      run: python condobolin_apw1.py

    - name: Update Condobolin BAR1 (CropConnect)
      run: python condobolin_bar1.py

    - name: Update NSW Goat OTH Price
      run: python update_goats.py

    - name: Update Forbes Cattle Averages
      id: cattle
      continue-on-error: true
      run: python update_wagga_cattle.py

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
        find . -type d -name __pycache__ -prune -exec rm -rf {} +
        git add .
        git rm -r --cached --ignore-unmatch __pycache__ || true
        git commit -m "Automated update" || echo "No changes to commit"
        git fetch origin main
        git rebase -X theirs origin/main
        git push origin HEAD:main

    - name: Report Griffith scraper failure
      if: steps.griffith.outcome == 'failure'
      run: |
        echo "::error::Griffith scraper failed; the old sheep feed was retained. Check the Update Griffith Sheep Report logs."
        exit 1

    - name: Report Forbes cattle scraper failure
      if: steps.cattle.outcome == 'failure'
      run: |
        echo "::error::Forbes cattle scraper failed; the old cattle feed was retained. Check the Update Forbes Cattle Averages logs."
        exit 1
