name: Update Livestock and Grain Feeds

on:
  schedule:
    - cron: "0 * * * *"   # Runs every hour
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Update Wagga Sheep Report
      run: python update_wagga.py

    - name: Update Griffith Sheep Report
      run: python update_griffith.py

    - name: Update Wheat APW1 Price
      run: python update_wheat.py

    - name: Update Barley BAR1 Price
      run: python update_barley.py

    - name: Update NSW Goat OTH Price
      run: python update_goats.py

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
        git add .
        git commit -m "Automated update" || echo "No changes to commit"
        git push
