name: Update Wagga RSS Feed

on:
  schedule:
    - cron: "0 * * * *"   # Runs every hour
  workflow_dispatch:      # Allows manual run

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        pip install requests beautifulsoup4

    - name: Run Wagga scraper
      run: python update_wagga.py

    - name: Run Griffith scraper
      run: python update_griffith.py

    - name: Commit updated RSS feed
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add wagga.xml
        git add griffith.xml
        git commit -m "Auto-update RSS feeds" || echo "No changes"
        git push
