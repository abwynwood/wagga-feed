name: Update Grain Feeds

on:
  schedule:
    - cron: "0,30 * * * *"
  workflow_dispatch:

concurrency:
  group: dakboard-feed-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          python -m playwright install chromium
      - name: Update grain feeds
        run: |
          python hillston_apw1.py
          python hillston_bar1.py
          python condobolin_apw1.py
          python condobolin_bar1.py
      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git add hillston_apw1.xml hillston_bar1.xml condobolin_apw1.xml condobolin_bar1.xml grain_history.json
          git diff --cached --quiet && exit 0
          git commit -m "Update grain feeds"
          git pull --rebase -X theirs origin main
          git push origin HEAD:main
